<text x='32' y='730' font-size='12.5' font-weight='400' fill='#52514e'>Interaction: hover a region for degrees, share, and the middle 50% of program earnings; click to select that field in the earnings chart;</text>
<text x='32' y='747' font-size='12.5' font-weight='400' fill='#52514e'>brushing tuition recomputes areas for the selected schools (the outline and color scale stay fixed so changes are comparable).</text>
<text x='32' y='764' font-size='12.5' font-weight='400' fill='#52514e'>Design risk: irregular areas are hard to compare precisely, so every region is labeled with its % and the final view will add a sorted bar list beside it.</text>
